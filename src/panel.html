<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ports-box</title>
<style>
:root {
  color-scheme: light dark;
  --ground: #eef1f4;
  --surface: #ffffff;
  --sunk: #e3e8ed;
  --ink: #16202b;
  --muted: #5b6b7a;
  --line: #cdd5dd;
  --live: #0e7c7b;
  --warn: #b86a00;
  --down: #c2362f;
  --focus: #2f6fde;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Mono", "SF Mono", ui-monospace, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0f1722;
    --surface: #172230;
    --sunk: #1f2c3c;
    --ink: #dce4ec;
    --muted: #8fa0b2;
    --line: #2c3b4d;
    --live: #3fc1b6;
    --warn: #e6a23c;
    --down: #f0736b;
    --focus: #7aa7ff;
  }
}
* { box-sizing: border-box; }
html { background: var(--ground); }
body {
  margin: 0;
  font: 15px/1.5 var(--sans);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.mono { font-family: var(--mono); font-size: 0.93em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.shell { max-width: 68rem; margin: 0 auto; padding: 0 1.25rem 7rem; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.5rem;
  padding: 1.25rem 0 1rem; border-bottom: 1px solid var(--line);
}
.brand { font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-right: auto; }
.tab {
  border: 0; background: none; padding: 0.35rem 0.75rem; border-radius: 0.4rem;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.tab[aria-current="page"] { background: var(--sunk); color: var(--ink); font-weight: 600; }
.plain {
  border: 1px solid var(--line); background: var(--surface); padding: 0.35rem 0.8rem;
  border-radius: 0.4rem; cursor: pointer;
}
.plain:hover { border-color: var(--muted); }
.primary { border: 1px solid var(--live); background: var(--live); color: var(--surface); font-weight: 600; }
.primary:disabled, .plain:disabled { opacity: 0.5; cursor: default; }
.quiet { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0.25rem 0.4rem; border-radius: 0.3rem; }
.quiet:hover { color: var(--down); }
.lost { color: var(--warn); font-size: 0.9rem; }

.user { padding: 1.75rem 0 0.5rem; border-bottom: 1px solid var(--line); }
.user:last-child { border-bottom: 0; }
.user-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; }
.user-name { font-size: 1.35rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.spent { margin-left: auto; color: var(--muted); }
.spent strong { color: var(--ink); font-weight: 600; }
.flag { color: var(--down); font-weight: 600; }
.meter { height: 0.5rem; background: var(--sunk); border-radius: 0.25rem; margin: 0.6rem 0 0.5rem; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--live); border-radius: inherit; min-width: 2px; }
.meter.near i { background: var(--warn); }
.meter.full i { background: var(--down); }
.facts { display: flex; flex-wrap: wrap; gap: 0.15rem 1.5rem; margin: 0 0 1rem; color: var(--muted); font-size: 0.9rem; }
.facts b { color: var(--ink); font-weight: 600; }

.routes { list-style: none; margin: 0; padding: 0; }
.route {
  display: grid; align-items: start; gap: 0.25rem 0.9rem;
  grid-template-columns: 4.6rem 11rem minmax(2.5rem, 1fr) minmax(13rem, 1.6fr) 7rem;
  overflow-wrap: anywhere;
  padding: 0.55rem 0; border-top: 1px solid var(--line);
  --wire: var(--live);
}
.route.fallback { --wire: var(--warn); }
.route.down { --wire: var(--down); }
.route.off { --wire: var(--line); color: var(--muted); }
.proto { color: var(--muted); font-size: 0.85rem; padding-top: 0.1rem; }
.wire { position: relative; height: 1.5rem; }
.wire::before {
  content: ""; position: absolute; left: 0; right: 0.4rem; top: 50%;
  border-top: 2px solid var(--wire);
}
.route.off .wire::before { border-top-style: dashed; }
.wire::after {
  content: ""; position: absolute; right: 0; top: 50%; translate: 0 -50%;
  border: 0.32rem solid transparent; border-left-color: var(--wire); border-right-width: 0;
}
.targets { list-style: none; margin: 0; padding: 0; }
.target { display: flex; align-items: baseline; gap: 0.5rem; color: var(--muted); }
.target .dot {
  flex: none; width: 0.6rem; height: 0.6rem; border-radius: 50%;
  border: 2px solid var(--muted); align-self: center;
}
.target.active { color: var(--ink); font-weight: 600; }
.target.active .dot { background: var(--wire); border-color: var(--wire); }
.target.dead .dot { border-color: var(--down); background: linear-gradient(45deg, transparent 42%, var(--down) 42% 58%, transparent 58%); }
.target .state { font-size: 0.82rem; font-weight: 400; color: var(--muted); }
.target.dead .state { color: var(--down); }
.label { color: var(--muted); font-size: 0.85rem; text-align: right; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 2rem 0; }

.form-row { display: flex; flex-wrap: wrap; align-items: end; gap: 0.75rem 1rem; }
.field { display: grid; gap: 0.2rem; min-width: 0; }
.field > span { font-size: 0.82rem; color: var(--muted); }
.field input, .field select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 0.35rem;
  padding: 0.35rem 0.5rem; min-width: 0; width: 100%;
}
.field input:hover, .field select:hover { border-color: var(--muted); }
.hint { color: var(--muted); font-size: 0.88rem; margin: 0.4rem 0 0; max-width: 46rem; }
.source { margin: 1.25rem 0 0; color: var(--muted); max-width: 46rem; }
.totals { padding: 1.25rem 0 1.5rem; border-bottom: 1px solid var(--line); }
.edit-user { padding: 1.5rem 0; border-bottom: 1px solid var(--line); }
.edit-user .form-row .field { flex: 0 1 14rem; }
.edit-rule {
  display: grid; align-items: end; gap: 0.5rem 0.6rem; margin-top: 0.75rem; padding-top: 0.75rem;
  border-top: 1px dashed var(--line);
  grid-template-columns: 3.2rem 6.5rem minmax(8rem, 1fr) minmax(8rem, 1.2fr) minmax(8rem, 1.2fr) minmax(4.5rem, 0.6fr) 4.8rem auto;
}
.edit-rule .on { display: grid; gap: 0.2rem; justify-items: start; }
.edit-rule .on span { font-size: 0.82rem; color: var(--muted); }
.edit-rule .on input { width: 1.1rem; height: 1.1rem; margin: 0.45rem 0; accent-color: var(--live); }
.adders { display: flex; gap: 0.5rem; margin-top: 1rem; }
.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--line); padding: 0.75rem 1.25rem;
}
.savebar > div { max-width: 68rem; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.savebar p { margin: 0 auto 0 0; min-width: 12rem; flex: 1; overflow-wrap: anywhere; }
.savebar p.error { color: var(--down); }
.savebar p.ok { color: var(--live); }

.door { max-width: 22rem; margin: 14vh auto 0; padding: 0 1.25rem; }
.door h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 0.25rem; }
.door p { color: var(--muted); margin: 0 0 1.5rem; }
.door form { display: grid; gap: 0.9rem; }
.door .primary { padding: 0.5rem; border-radius: 0.4rem; cursor: pointer; }
.door .error { color: var(--down); margin: 0; }

.account { padding: 1.5rem 0 1.25rem; border-bottom: 1px solid var(--line); }
.account-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
.account-title { font-size: 1.1rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.account-head .spent { margin-left: auto; }
.account .facts { margin: 0.75rem 0 0; }
.note { margin: 0.6rem 0 0; overflow-wrap: anywhere; }
.note.ok, .test-result.ok { color: var(--live); }
.note.error, .test-result.error { color: var(--down); }
.transfer { margin-top: 1rem; }
.transfer .field { flex: 0 1 11rem; }
.section-title { font-size: 1rem; font-weight: 650; margin: 0 0 0.75rem; }
.settings-row .field { flex: 1 1 13rem; }
.test-result { margin: 0; align-self: center; }
.pad { padding: 1.25rem 0 0.75rem; }
.table-wrap { overflow-x: auto; margin-top: 0.75rem; }
.table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.table th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: 0.82rem;
  padding: 0.5rem 0.75rem 0.4rem 0; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.table td { padding: 0.55rem 0.75rem 0.55rem 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table .num, .table .mono { white-space: nowrap; }
.table .num { text-align: right; }
.table .dim { color: var(--muted); }
.plus { color: var(--live); }
.minus { color: var(--down); }
.credit { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.credit select, .filter select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 0.35rem; padding: 0.3rem 0.45rem;
}

@media (max-width: 52rem) {
  .route { grid-template-columns: 4.6rem 1fr; }
  .route .wire { display: none; }
  .route .targets, .route .label { grid-column: 2; text-align: left; }
  .spent { margin-left: 0; width: 100%; }
  .edit-rule { grid-template-columns: 3.2rem 1fr 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .meter i { transition: width 0.4s ease; }
}
</style>
</head>

const t = (key, ...args) => args.reduce((s, v, i) => s.replace("{" + i + "}", v), TEXT[key][zh ? 1 : 0]);
const STOP = Symbol("stop");
const app = document.getElementById("app");
let screen = "loading";
let tab = "overview";
let users = null;
let accounting = null;
let ledgerEntries = null;
let ledgerUser = "";
let lost = false;
let draft = null;
let revision = null;
let source = "file";
let secretSet = false;
let dirty = false;
let saving = false;
let notice = null;
let loginError = false;
let canSignOut = true;
let syncing = false;
let crediting = false;
let accountNotice = null;
let packageNotice = null;
let testState = null;
const transferDraft = { from: "", to: "", amount: "" };
const packageChoice = {};

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  for (const [key, value] of Object.entries(props || {})) {
    if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else if (key === "class") el.className = value;
    else if (key === "value" || key === "checked" || key === "disabled") el[key] = value;
    else if (value != null && value !== false) el.setAttribute(key, value);
  }
  return el;
}

function fmt(bytes) {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let value = bytes, unit = 0;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
  return unit === 0 ? bytes + "B" : value.toFixed(2) + units[unit];
}

function signed(bytes, plus) {
  return (bytes < 0 ? "−" : plus && bytes > 0 ? "+" : "") + fmt(Math.abs(bytes));
}

function when(seconds) {
  return new Date(seconds * 1000).toLocaleString();
}

function list(text) {
  return text.split(/[\s,，]+/).filter(Boolean);
}

async function call(method, path, body) {
  let response;
  try {
    response = await fetch("/dashboard/api/" + path, {
      method,
      credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new Error(t("lost"));
  }
  if (response.status === 404) { show("gone"); throw STOP; }
  if (response.status === 401 && path !== "login") { show("login"); throw STOP; }
  return response;
}

async function failureText(response) {
  const body = await response.json().catch(() => ({}));
  return body.error || response.statusText;
}

function show(next) {
  screen = next;
  render();
}

function busyInput() {
  const el = document.activeElement;
  return el && app.contains(el) && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName);
}

async function refresh() {
  try {
    const response = await call("GET", "status");
    const body = await response.json();
    users = body.users;
    accounting = body.accounting;
    canSignOut = body.can_sign_out;
    lost = false;
  } catch (e) {
    if (e === STOP) return;
    lost = true;
  }
  if (screen !== "main") show("main");
  else if ((tab === "overview" || tab === "packages") && !busyInput()) render();
  else if (tab === "ledger") { renderTop(); loadLedger(); }
  else renderTop();
}

function render() {
  const shell = (...kids) => h("div", { class: "shell" }, topView(), kids);
  if (screen === "login") app.replaceChildren(loginView());
  else if (screen === "gone") app.replaceChildren(goneView());
  else if (screen === "loading") app.replaceChildren(h("div", { class: "door" }, h("p", null, t("loading"))));
  else if (tab === "edit") app.replaceChildren(shell(editView()), saveBar());
  else if (tab === "settings") app.replaceChildren(shell(settingsView()), saveBar());
  else if (tab === "packages") app.replaceChildren(shell(packagesView()));
  else if (tab === "ledger") app.replaceChildren(shell(ledgerView()));
  else app.replaceChildren(shell(overviewView()));
}

function renderTop() {
  const top = app.querySelector(".top");
  if (top) top.replaceWith(topView());
}

function loginView() {
  const username = h("input", { name: "username", autocomplete: "username", required: "" });
  const password = h("input", { name: "password", type: "password", autocomplete: "current-password", required: "" });
  const submit = async (event) => {
    event.preventDefault();
    try {
      const response = await call("POST", "login", { username: username.value, password: password.value });
      if (!response.ok) { loginError = true; render(); return; }
      loginError = false;
      screen = "loading";
      refresh();
    } catch (e) {
      if (e !== STOP) { loginError = true; render(); }
    }
  };
  return h("main", { class: "door" },
    h("h1", null, "ports-box"),
    h("p", null, t("signInLead")),
    h("form", { onsubmit: submit },
      h("label", { class: "field" }, h("span", null, t("username")), username),
      h("label", { class: "field" }, h("span", null, t("password")), password),
      loginError && h("p", { class: "error", role: "alert" }, t("wrongLogin")),
      h("button", { class: "primary" }, t("signIn"))));
}

function goneView() {
  return h("main", { class: "door" },
    h("h1", null, t("goneTitle")),
    h("p", null, t("goneLead", location.origin + "/?token=…")));
}

function topView() {
  const go = (next) => () => {
    if (next === "edit" || next === "settings") { openDraft(next, false); return; }
    tab = next;
    render();
    refresh();
  };
  const signOut = async () => {
    if (dirty && !confirm(t("discard") + "?")) return;
    try { await call("POST", "logout"); } catch (e) { if (e === STOP) return; }
    draft = null; dirty = false; users = null; accounting = null; ledgerEntries = null;
    show("loading");
    refresh();
  };
  const tabButton = (name) => h("button", {
    class: "tab", "aria-current": tab === name ? "page" : null, onclick: go(name),
  }, t(name));
  return h("header", { class: "top" },
    h("h1", { class: "brand" }, "ports-box"),
    h("nav", { class: "tabs" }, ["overview", "packages", "ledger", "edit", "settings"].map(tabButton)),
    lost && h("span", { class: "lost", role: "status" }, t("lost")),
    canSignOut && h("button", { class: "plain", onclick: signOut }, t("signOut")));
}

function remoteActive() {
  return accounting && accounting.mode === "remote" && accounting.migrated;
}

function overviewView() {
  if (!users) return h("p", { class: "empty" }, t("loading"));
  return h("main", null,
    accountView(),
    users.length ? users.map(userView) : h("p", { class: "empty" }, t("noUsers")));
}

function syncButton() {
  return h("button", {
    class: "plain", type: "button", disabled: syncing || !accounting || accounting.mode !== "remote", onclick: syncNow,
  }, syncing ? t("syncing") : t("syncNow"));
}

function accountView() {
  if (!accounting || accounting.mode !== "remote") return null;
  const a = accounting;
  const total = Object.values(a.balances).reduce((sum, value) => sum + value, 0);
  const title = [t("remoteTitle"), a.provider === "volcengine" ? "Volcengine" : a.provider, a.regions.join(", ")]
    .filter(Boolean).join(" · ");
  return h("section", { class: "account" },
    h("div", { class: "account-head" },
      h("h2", { class: "account-title" }, title),
      h("span", { class: "spent" }, a.synced_at ? t("lastSync", when(a.synced_at)) : t("neverSynced")),
      syncButton()),
    a.last_error && h("p", { class: "note error" }, t("syncFailed", a.last_error)),
    a.migrated
      ? h("p", { class: "facts" },
        h("span", null, t("providerRemaining"), " ", h("b", null, fmt(a.remaining))),
        h("span", null, t("balances"), " ", h("b", null, signed(total))),
        h("span", null, t("unallocated"), " ", h("b", null, signed(a.unallocated))),
        h("span", null, t("calibration", fmt(a.consumed), fmt(a.metered))))
      : h("p", { class: "hint" }, t("waiting")),
    a.migrated && transferView(),
    accountNotice && h("p", { class: "note " + accountNotice.kind, role: "status" }, accountNotice.text));
}

function transferView() {
  const names = (users || []).map((user) => user.name);
  if (names.length < 2) return null;
  if (!names.includes(transferDraft.from)) transferDraft.from = names[0];
  if (!names.includes(transferDraft.to)) transferDraft.to = names[1];
  const pick = (key, label) => {
    const select = h("select", {
      value: transferDraft[key],
      onchange: () => { transferDraft[key] = select.value; },
    }, names.map((name) => h("option", { value: name }, name)));
    return h("label", { class: "field" }, h("span", null, label), select);
  };
  const amount = h("input", {
    value: transferDraft.amount, placeholder: "10GB", spellcheck: "false", autocomplete: "off",
    oninput: () => { transferDraft.amount = amount.value; },
  });
  return h("form", { class: "form-row transfer", onsubmit: submitTransfer },
    pick("from", t("from")),
    pick("to", t("to")),
    h("label", { class: "field" }, h("span", null, t("amount")), amount),
    h("button", { class: "plain" }, t("transfer")));
}

async function submitTransfer(event) {
  event.preventDefault();
  const amount = size(transferDraft.amount);
  if (amount == null) return;
  try {
    const response = await call("POST", "transfer", { from: transferDraft.from, to: transferDraft.to, amount });
    if (response.ok) {
      transferDraft.amount = "";
      accountNotice = { kind: "ok", text: t("transferDone") };
    } else {
      accountNotice = { kind: "error", text: await failureText(response) };
    }
  } catch (e) {
    if (e === STOP) return;
    accountNotice = { kind: "error", text: e.message };
  }
  document.activeElement.blur();
  await refresh();
  render();
}

async function syncNow() {
  syncing = true;
  accountNotice = null;
  render();
  try {
    const response = await call("POST", "sync");
    if (!response.ok) accountNotice = { kind: "error", text: await failureText(response) };
  } catch (e) {
    if (e === STOP) { syncing = false; return; }
    accountNotice = { kind: "error", text: e.message };
  }
  syncing = false;
  await refresh();
  render();
}

function userView(user) {
  const remote = remoteActive();
  const limited = user.limit_bytes != null;
  const share = limited && user.limit_bytes > 0 ? Math.min(1, user.used_bytes / user.limit_bytes) : limited ? 1 : 0;
  const level = user.exhausted ? " full" : share >= 0.9 ? " near" : "";
  const spent = remote ? t("balanceLeft", user.remaining)
    : limited ? t("usedOf", user.used, user.total) : t("usedOnly", user.used);
  return h("section", { class: "user" },
    h("div", { class: "user-head" },
      h("h2", { class: "user-name" }, user.name),
      user.exhausted && h("span", { class: "flag" }, t(remote ? "noBalance" : "exhausted")),
      h("span", { class: "spent" }, spent)),
    limited && !remote && h("div", { class: "meter" + level, role: "img", "aria-label": Math.round(share * 100) + "%" },
      h("i", { style: "width:" + (share * 100).toFixed(2) + "%" })),
    h("p", { class: "facts" },
      limited && !remote && h("span", null, t("remaining"), " ", h("b", null, user.remaining)),
      remote && h("span", null, t("billed"), " ", h("b", null, user.used)),
      h("span", null, t("thisHour"), " ", h("b", null, user.hour_used)),
      h("span", null, t("upload"), " ", h("b", null, fmt(user.upload_bytes))),
      h("span", null, t("download"), " ", h("b", null, fmt(user.download_bytes)))),
    user.rules.length
      ? h("ul", { class: "routes" }, user.rules.map(routeView))
      : h("p", { class: "empty" }, t("noRules")));
}

function routeView(rule) {
  const active = rule.targets.findIndex((target) => target.active);
  const state = !rule.enabled ? " off"
    : active >= 0 && !rule.targets[active].healthy ? " down"
    : active > 0 ? " fallback" : "";
  return h("li", { class: "route" + state },
    h("span", { class: "proto" }, rule.protocol === "both" ? "tcp+udp" : rule.protocol),
    h("span", { class: "mono" }, rule.listen),
    h("span", { class: "wire", "aria-hidden": "true" }),
    h("ul", { class: "targets" }, rule.targets.map((target) => {
      const kind = !rule.enabled ? "" : !target.healthy ? " dead" : target.active ? " active" : "";
      const word = !rule.enabled ? "" : !target.healthy ? t("dead") : target.active ? t("inUse") : t("standby");
      return h("li", { class: "target" + kind },
        h("i", { class: "dot" }),
        h("span", { class: "mono" }, target.addr),
        rule.targets.length > 1 || kind === " dead" ? h("span", { class: "state" }, word) : null);
    })),
    h("span", { class: "label" }, rule.enabled ? rule.tag : [rule.tag, t("off")].filter(Boolean).join(", ")));
}

function statusText(status) {
  const key = "status" + status;
  return TEXT[key] ? t(key) : status;
}

function creditText(credit) {
  if (credit.kind === "migration") return t("creditMigration");
  if (credit.kind === "split") return t("creditSplit");
  return t("creditUser", credit.user);
}

function creditCell(record) {
  if (record.credit) return creditText(record.credit);
  if (record.status !== "Effective") return h("span", { class: "dim" }, t("creditNone"));
  const options = [["split", t("splitAll")]]
    .concat((users || []).map((user) => ["user:" + user.name, t("giveTo", user.name)]));
  if (!options.some(([value]) => value === packageChoice[record.id])) packageChoice[record.id] = "split";
  const select = h("select", {
    value: packageChoice[record.id],
    onchange: () => { packageChoice[record.id] = select.value; },
  }, options.map(([value, text]) => h("option", { value }, text)));
  return h("div", { class: "credit" },
    select,
    h("button", {
      class: "plain", type: "button", disabled: crediting,
      onclick: () => creditPackage(record.id, packageChoice[record.id]),
    }, crediting ? t("crediting") : t("credit")));
}

function packagesView() {
  if (!accounting || !accounting.provider) return h("p", { class: "empty" }, t("packagesOff"));
  const a = accounting;
  const rank = (record) => (record.status === "Effective" ? 0 : 1);
  const rows = a.packages.slice().sort((x, y) => rank(x) - rank(y) || x.expiry.localeCompare(y.expiry));
  const head = ["colId", "colName", "colRegion", "colTotal", "colAvailable", "colExpiry", "colStatus", "colCredit"]
    .map((key) => h("th", { class: key === "colTotal" || key === "colAvailable" ? "num" : null }, t(key)));
  const row = (record) => h("tr", null,
    h("td", { class: "mono" }, record.id),
    h("td", null, record.name),
    h("td", null, record.region),
    h("td", { class: "num" }, fmt(record.total)),
    h("td", { class: "num" }, fmt(record.available)),
    h("td", null, record.expiry ? new Date(record.expiry).toLocaleDateString() : ""),
    h("td", { class: record.status === "Effective" ? null : "dim" }, statusText(record.status)),
    h("td", null, creditCell(record)));
  return h("main", null,
    h("div", { class: "account-head pad" },
      h("span", { class: "hint" }, a.synced_at ? t("lastSync", when(a.synced_at)) : t("neverSynced")),
      h("span", { class: "spent" }, syncButton())),
    a.mode !== "remote" && h("p", { class: "hint" }, t("packagesIdle")),
    a.last_error && h("p", { class: "note error" }, t("syncFailed", a.last_error)),
    packageNotice && h("p", { class: "note " + packageNotice.kind, role: "status" }, packageNotice.text),
    !a.migrated && a.mode === "remote" && h("p", { class: "hint" }, t("waiting")),
    rows.length
      ? h("div", { class: "table-wrap" }, h("table", { class: "table" }, h("thead", null, h("tr", null, head)), h("tbody", null, rows.map(row))))
      : a.migrated && h("p", { class: "empty" }, t("noPackages", a.regions.join(", "))),
    a.ignored.length > 0 && h("p", { class: "hint" }, t("ignoredPackages", a.ignored.length)));
}

async function creditPackage(id, choice) {
  if (dirty && !confirm(t("discard") + "?")) return;
  crediting = true;
  packageNotice = null;
  render();
  try {
    const response = await call("GET", "config");
    const config = await response.json();
    revision = config.revision;
    source = config.source;
    secretSet = config.secret_key_set;
    draft = toDraft(config);
    dirty = false;
    notice = null;
    if (choice === "split") {
      draft.accounting.packages = list(draft.accounting.packages).concat(id).join(", ");
    } else {
      const user = draft.users.find((user) => "user:" + user.name === choice);
      if (user) user.packages = list(user.packages).concat(id).join(", ");
    }
    const saved = await call("PUT", "config", fromDraft());
    if (!saved.ok) {
      packageNotice = { kind: "error", text: await failureText(saved) };
    } else {
      revision = (await saved.json()).revision;
      source = "panel";
      const synced = await call("POST", "sync");
      packageNotice = synced.ok ? { kind: "ok", text: t("credited") } : { kind: "error", text: await failureText(synced) };
    }
    draft = null;
  } catch (e) {
    if (e === STOP) { crediting = false; return; }
    packageNotice = { kind: "error", text: e.message };
  }
  crediting = false;
  await refresh();
  render();
}

async function loadLedger() {
  try {
    const response = await call("GET", "ledger");
    ledgerEntries = await response.json();
  } catch (e) {
    if (e === STOP) return;
    lost = true;
    renderTop();
    return;
  }
  if (tab === "ledger" && !busyInput()) render();
}

function kindText(kind) {
  return t("kind" + kind[0].toUpperCase() + kind.slice(1));
}

function ledgerView() {
  if (!ledgerEntries) { loadLedger(); return h("p", { class: "empty" }, t("loading")); }
  const names = [...new Set(ledgerEntries.map((entry) => entry.user))].sort();
  const filter = h("select", {
    value: ledgerUser,
    onchange: () => { ledgerUser = filter.value; render(); },
  }, [["", t("allUsers")]].concat(names.map((name) => [name, name])).map(([value, text]) => h("option", { value }, text)));
  const rows = ledgerEntries.filter((entry) => !ledgerUser || entry.user === ledgerUser);
  const head = ["colTime", "colKind", "colUser", "colAmount", "colId", "colNote"]
    .map((key) => h("th", { class: key === "colAmount" ? "num" : null }, t(key)));
  const row = (entry) => h("tr", null,
    h("td", { class: "dim" }, when(entry.time)),
    h("td", null, kindText(entry.kind)),
    h("td", null, entry.user),
    h("td", { class: "num " + (entry.amount < 0 ? "minus" : "plus") }, signed(entry.amount, true)),
    h("td", { class: "mono" }, entry.package || ""),
    h("td", null, entry.kind === "transfer" ? t(entry.amount < 0 ? "transferTo" : "transferFrom", entry.note) : entry.note));
  return h("main", null,
    h("div", { class: "form-row pad" }, h("label", { class: "field filter" }, h("span", null, t("colUser")), filter)),
    rows.length
      ? h("div", { class: "table-wrap" }, h("table", { class: "table" }, h("thead", null, h("tr", null, head)), h("tbody", null, rows.map(row))))
      : h("p", { class: "empty" }, t("ledgerEmpty")));
}

function toDraft(config) {
  const accounting = config.accounting || {};
  const remote = accounting.remote || {};
  return {
    total_quota: String(config.total_quota ?? ""),
    accounting: {
      mode: accounting.mode || "offline",
      metering: accounting.metering || "max",
      provider: remote.provider || "volcengine",
      access_key: remote.access_key || "",
      secret_key: "",
      regions: (remote.regions || []).join(", "),
      interval_secs: String(remote.interval_secs ?? 600),
      packages: (remote.packages || []).join(", "),
    },
    users: config.users.map((user) => ({
      name: user.name,
      quota: String(user.quota ?? ""),
      packages: (user.packages || []).join(", "),
      rules: user.rules.map((rule) => ({
        listen: rule.listen,
        target: rule.target,
        fallback: (rule.fallback || []).join(", "),
        protocol: rule.protocol || "both",
        check_secs: String(rule.check_secs ?? 10),
        tag: rule.tag || "",
        enabled: rule.enabled !== false,
      })),
    })),
  };
}

function size(text) {
  const value = text.trim();
  if (!value) return null;
  return /^\d+$/.test(value) ? Number(value) : value;
}

function remoteDraft() {
  const a = draft.accounting;
  return {
    provider: a.provider,
    access_key: a.access_key.trim(),
    secret_key: a.secret_key,
    regions: list(a.regions),
    interval_secs: Number(a.interval_secs),
    packages: list(a.packages),
  };
}

function fromDraft() {
  const a = draft.accounting;
  const accounting = { mode: a.mode, metering: a.metering };
  const remoteUsed = a.mode === "remote" || secretSet || a.secret_key
    || a.access_key.trim() || a.regions.trim() || a.packages.trim();
  if (remoteUsed) accounting.remote = remoteDraft();
  return {
    revision,
    total_quota: size(draft.total_quota),
    accounting,
    users: draft.users.map((user) => ({
      name: user.name.trim(),
      quota: size(user.quota),
      packages: list(user.packages),
      rules: user.rules.map((rule) => {
        const out = {
          listen: rule.listen.trim(),
          target: rule.target.trim(),
          fallback: list(rule.fallback),
          protocol: rule.protocol,
          check_secs: Number(rule.check_secs),
          enabled: rule.enabled,
        };
        if (rule.tag.trim()) out.tag = rule.tag.trim();
        return out;
      }),
    })),
  };
}

async function openDraft(next, force) {
  if (!draft || force) {
    try {
      const response = await call("GET", "config");
      const config = await response.json();
      revision = config.revision;
      source = config.source;
      secretSet = config.secret_key_set;
      draft = toDraft(config);
      dirty = false;
      notice = null;
      testState = null;
    } catch (e) {
      if (e === STOP) return;
      lost = true;
      renderTop();
      return;
    }
  }
  tab = next;
  render();
}

function touch() {
  if (dirty && !notice) return;
  dirty = true;
  notice = null;
  renderBar();
}

function change(mutate) {
  mutate();
  dirty = true;
  notice = null;
  render();
}

function field(label, object, key, extra) {
  const input = h("input", Object.assign({
    value: object[key],
    spellcheck: "false",
    autocomplete: "off",
    oninput: () => { object[key] = input.value; touch(); },
  }, extra));
  return h("label", { class: "field" }, h("span", null, label), input);
}

function choice(label, object, key, options) {
  const select = h("select", {
    value: object[key],
    onchange: () => { object[key] = select.value; touch(); },
  }, options.map(([value, text]) => h("option", { value }, text)));
  return h("label", { class: "field" }, h("span", null, label), select);
}

function ruleEditor(user, rule) {
  const enabled = h("input", {
    type: "checkbox", checked: rule.enabled,
    onchange: () => { rule.enabled = enabled.checked; touch(); },
  });
  const protocol = h("select", {
    value: rule.protocol,
    onchange: () => { rule.protocol = protocol.value; touch(); },
  }, [["both", "tcp+udp"], ["tcp", "tcp"], ["udp", "udp"]].map(([value, text]) => h("option", { value }, text)));
  const remove = () => change(() => user.rules.splice(user.rules.indexOf(rule), 1));
  return h("div", { class: "edit-rule" },
    h("label", { class: "on" }, h("span", null, t("on")), enabled),
    h("label", { class: "field" }, h("span", null, t("protocol")), protocol),
    field(t("listen"), rule, "listen", { class: "mono", placeholder: "0.0.0.0:8080" }),
    field(t("target"), rule, "target", { class: "mono", placeholder: "10.0.0.2:80" }),
    field(t("fallback"), rule, "fallback", { class: "mono", placeholder: t("fallbackPlaceholder") }),
    field(t("tag"), rule, "tag", { placeholder: t("none") }),
    field(t("check"), rule, "check_secs", { type: "number", min: "1" }),
    h("button", { class: "quiet", type: "button", onclick: remove }, t("removeRule")));
}

function userEditor(user) {
  const blank = { listen: "", target: "", fallback: "", protocol: "both", check_secs: "10", tag: "", enabled: true };
  return h("section", { class: "edit-user" },
    h("div", { class: "form-row" },
      field(t("name"), user, "name"),
      field(t("quota"), user, "quota", { placeholder: draft.total_quota.trim() ? t("quotaPlaceholder") : t("none") }),
      field(t("userPackages"), user, "packages", { class: "mono", placeholder: t("fallbackPlaceholder") }),
      h("button", { class: "quiet", type: "button", onclick: () => change(() => draft.users.splice(draft.users.indexOf(user), 1)) }, t("removeUser"))),
    user.rules.map((rule) => ruleEditor(user, rule)),
    h("div", { class: "adders" },
      h("button", { class: "plain", type: "button", onclick: () => change(() => user.rules.push(Object.assign({}, blank))) }, t("addRule"))));
}

function editView() {
  return h("main", null,
    h("p", { class: "source" }, t(source === "panel" ? "fromPanel" : "fromFile")),
    draft.users.map(userEditor),
    h("div", { class: "adders" },
      h("button", { class: "plain", type: "button", onclick: () => change(() => draft.users.push({ name: "", quota: "", packages: "", rules: [] })) }, t("addUser"))));
}

function testView() {
  return h("p", { class: "test-result " + (testState ? testState.kind : ""), role: "status" }, testState ? testState.text : "");
}

function renderTest() {
  const el = app.querySelector(".test-result");
  if (el) el.replaceWith(testView());
}

async function testRemote() {
  testState = { kind: "", text: t("testing") };
  renderTest();
  const remote = remoteDraft();
  remote.interval_secs = remote.interval_secs || 600;
  try {
    const response = await call("POST", "remote/test", { remote });
    if (response.ok) {
      const body = await response.json();
      testState = { kind: "ok", text: t("testOk", body.packages, fmt(body.remaining)) + (body.ignored ? t("testIgnored", body.ignored) : "") };
    } else {
      testState = { kind: "error", text: await failureText(response) };
    }
  } catch (e) {
    if (e === STOP) return;
    testState = { kind: "error", text: e.message };
  }
  renderTest();
}

function settingsView() {
  const a = draft.accounting;
  return h("main", null,
    h("p", { class: "source" }, t(source === "panel" ? "fromPanel" : "fromFile")),
    h("section", { class: "totals" },
      h("div", { class: "form-row settings-row" },
        choice(t("modeLabel"), a, "mode", [["offline", t("modeOffline")], ["remote", t("modeRemote")]]),
        choice(t("metering"), a, "metering", [["max", t("meterMax")], ["sum", t("meterSum")], ["download", t("meterDownload")]])),
      h("p", { class: "hint" }, t("modeHint")),
      h("p", { class: "hint" }, t("meterHint"))),
    h("section", { class: "totals" },
      h("h2", { class: "section-title" }, t("offlineTitle")),
      h("div", { class: "form-row" }, field(t("totalQuota"), draft, "total_quota", { placeholder: t("none") })),
      h("p", { class: "hint" }, t("totalHint"))),
    h("section", { class: "totals" },
      h("h2", { class: "section-title" }, t("remoteTitle")),
      h("div", { class: "form-row settings-row" },
        choice(t("provider"), a, "provider", [["volcengine", "Volcengine"]]),
        field(t("accessKey"), a, "access_key", { class: "mono" }),
        field(t("secretKey"), a, "secret_key", { class: "mono", type: "password", autocomplete: "new-password", placeholder: secretSet ? t("secretKept") : "" }),
        field(t("regions"), a, "regions", { class: "mono", placeholder: t("regionsPlaceholder") }),
        field(t("interval"), a, "interval_secs", { type: "number", min: "60" }),
        field(t("splitPackages"), a, "packages", { class: "mono", placeholder: t("fallbackPlaceholder") })),
      h("p", { class: "hint" }, t("remoteHint")),
      h("div", { class: "adders" },
        h("button", { class: "plain", type: "button", onclick: testRemote }, t("test")),
        testView())));
}

function saveBar() {
  const kind = notice ? notice.kind : "";
  const text = notice ? notice.text : dirty ? t("unsaved") : t("clean");
  return h("footer", { class: "savebar" }, h("div", null,
    h("p", { class: kind === "ok" ? "ok" : kind ? "error" : "", role: "status" }, text),
    kind === "conflict"
      ? h("button", { class: "plain", onclick: () => openDraft(tab, true) }, t("reload"))
      : h("button", { class: "plain", disabled: !dirty || saving, onclick: () => openDraft(tab, true) }, t("discard")),
    h("button", { class: "plain primary", disabled: !dirty || saving, onclick: saveConfig }, saving ? t("saving") : t("save"))));
}

function renderBar() {
  const bar = app.querySelector(".savebar");
  if (bar) bar.replaceWith(saveBar());
}

async function saveConfig() {
  saving = true;
  notice = null;
  renderBar();
  try {
    const response = await call("PUT", "config", fromDraft());
    if (response.ok) {
      const body = await response.json();
      revision = body.revision;
      source = "panel";
      secretSet = secretSet || !!draft.accounting.secret_key;
      draft.accounting.secret_key = "";
      dirty = false;
      notice = { kind: "ok", text: t("saved") };
      if (tab === "settings") render();
    } else {
      notice = { kind: response.status === 409 ? "conflict" : "error", text: await failureText(response) };
    }
  } catch (e) {
    if (e === STOP) { saving = false; return; }
    notice = { kind: "error", text: e.message };
  }
  saving = false;
  renderBar();
}

addEventListener("beforeunload", (event) => { if (dirty) event.preventDefault(); });
setInterval(() => { if (screen === "main" && !document.hidden) refresh(); }, 3000);
document.documentElement.lang = zh ? "zh" : "en";
render();
refresh();
</script>
</body>
</html>
